# Packaging config for Sable.
# Local: `pnpm --filter @sable/desktop exec electron-builder --mac --publish never`
# CI: .github/workflows/release.yml builds mac+win on tag push and publishes
# the installers to the GitHub Release (publish config below).
appId: com.sarikanwar.sable
productName: Sable
directories:
  buildResources: build
  output: release
files:
  - out/**
  - build/icon.png
  - '!**/*.map'
publish:
  provider: github
  owner: SarikAnwar01
  repo: sable
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
linux:
  icon: build/icon.png
  category: Network
  target:
    - AppImage
